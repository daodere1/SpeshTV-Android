name: SpeshTV Android validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [mobile, androidTv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter test test/ui/spesh_branding_test.dart test/data/services/app_update_service_store_test.dart
      - run: flutter build apk --debug --flavor ${{ matrix.flavor }} --dart-define=SPESHMEDIA_CLIENT=true
      - uses: actions/upload-artifact@v4
        with:
          name: SpeshTV-${{ matrix.flavor }}-debug
          path: build/app/outputs/flutter-apk/*-debug.apk
